        :root {

        body {

            color: var(--text-dark);
            line-height: 1.6;
        }

        .text-center { text-align: center; }

        /* Navigation */
        nav {

            justify-content: space-between;

            border-bottom: 4px solid var(--medium-purple);

        .logo-container { display: flex; align-items: center; gap: 10px; cursor: pointer; }

        /* Page Management */
        .page-section { display: none; animation: fadeIn 0.6s ease-out; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- BUTTONS --- */
        .btn {

            color: white;

            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .btn:hover { background-color: white; color: var(--primary-purple); transform: scale(1.05); }
